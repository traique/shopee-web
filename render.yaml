services:
  - type: web
    name: shopee-chromium-cdp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: CDP_TOKEN
        sync: false
      - key: CHROME_START_TIMEOUT_MS
        value: "30000"
      - key: CHROME_IDLE_TIMEOUT_MS
        value: "30000"
